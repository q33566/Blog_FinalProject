{% extends "base.html" %}
{% from "macros/form.html" import field %}
{% block title %}登入{% endblock title %}
{% block body %}
<section class="form-page narrow">
    <h1>登入</h1>
    <form novalidate method="post">
        {{ form.hidden_tag() }}
        {{ field(form.user_id, autocomplete='username') }}
        {{ field(form.password, autocomplete='current-password') }}
        <div class="actions">
            <button class="button" type="submit">登入</button>
            <span>還沒有帳號？<a href="{{ url_for('auth.register') }}">註冊</a></span>
        </div>
    </form>
</section>
{% endblock body %}
