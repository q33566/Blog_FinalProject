{% extends "base.html" %}
{% block title %}Tag{% endblock title %}
{% block body %}
<header class="masthead">
    <div class="manuscript"><h1>Tag</h1></div>
</header>
<ul class="tag-index">
    {% for name, count in tags %}
    <li><a href="{{ url_for('post.by_tag', tag=name) }}">#{{ name }}</a><span>{{ count }}</span></li>
    {% else %}
    <li class="empty">還沒有 tag。</li>
    {% endfor %}
</ul>
{% endblock body %}
