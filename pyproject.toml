[project]
name = "personal-blog"
version = "1.0.0"
description = "以 Flask 打造的個人部落格：文章、標籤、留言與管理後台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "markdown>=3.11.1",
    "nh3>=0.3.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
